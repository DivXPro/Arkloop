<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Box/card representing product image -->
  <g opacity="0.15" fill="none" stroke="white" stroke-width="2">
    <rect x="170" y="80" width="260" height="240" rx="16"/>
  </g>
  <g opacity="0.2" fill="white">
    <rect x="190" y="110" width="220" height="180" rx="8"/>
    <!-- Star/sparkle icons indicating generated quality -->
    <polygon points="300,140 305,155 320,155 308,165 312,180 300,170 288,180 292,165 280,155 295,155" opacity="0.5"/>
  </g>
  <!-- Bottom label bar -->
  <g opacity="0.12" fill="white">
    <rect x="190" y="295" width="100" height="10" rx="4"/>
    <rect x="190" y="315" width="160" height="10" rx="4"/>
  </g>
  <text x="300" y="365" text-anchor="middle" fill="white" font-size="20" font-family="system-ui, sans-serif" opacity="0.5">电商主图生成</text>
</svg>
