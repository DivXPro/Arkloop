<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1929"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Detail page layout mockup: stacked blocks -->
  <g opacity="0.12" fill="none" stroke="white" stroke-width="2">
    <rect x="120" y="50" width="360" height="60" rx="6"/>
    <rect x="120" y="120" width="360" height="80" rx="6"/>
    <rect x="120" y="210" width="360" height="60" rx="6"/>
    <rect x="120" y="280" width="360" height="70" rx="6"/>
  </g>
  <!-- Small image placeholders in blocks -->
  <g opacity="0.15" fill="white">
    <rect x="140" y="130" width="50" height="60" rx="4"/>
    <rect x="140" y="220" width="50" height="50" rx="4"/>
    <rect x="140" y="290" width="50" height="56" rx="4"/>
  </g>
  <!-- Text lines in blocks -->
  <g opacity="0.1" fill="white">
    <rect x="210" y="135" width="180" height="8" rx="3"/>
    <rect x="210" y="152" width="250" height="8" rx="3"/>
    <rect x="210" y="169" width="140" height="8" rx="3"/>
    <rect x="210" y="225" width="200" height="8" rx="3"/>
    <rect x="210" y="242" width="160" height="8" rx="3"/>
    <rect x="210" y="295" width="220" height="8" rx="3"/>
    <rect x="210" y="312" width="260" height="8" rx="3"/>
    <rect x="210" y="329" width="120" height="8" rx="3"/>
  </g>
  <text x="300" y="378" text-anchor="middle" fill="white" font-size="20" font-family="system-ui, sans-serif" opacity="0.5">电商详情页图生成</text>
</svg>
